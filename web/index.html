<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOOMD GUI — Two-Dimensional Particle Editor</title>
    <meta
      name="description"
      content="Browser interface for building HOOMD-blue projects that run on your own computer."
    />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbar__group toolbar__group--brand">
          <span class="brand">HOOMD GUI</span>
          <label class="visually-hidden" for="project-name">Project name</label>
          <input id="project-name" class="input input--title" type="text" autocomplete="off" />
        </div>

        <div class="toolbar__group">
          <button class="button" type="button" data-action="new-project">New</button>
          <button class="button" type="button" data-action="load-sample">Sample</button>
          <button class="button" type="button" data-action="import-project">Import…</button>
          <button class="button" type="button" data-action="export-project">Export JSON</button>
          <button class="button" type="button" data-action="view-json">View JSON</button>
          <span class="toolbar__divider"></span>
          <button class="button button--ghost" type="button" data-action="undo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
          <button class="button button--ghost" type="button" data-action="redo" title="Redo (Shift+Cmd/Ctrl+Z)">Redo</button>
          <span class="toolbar__divider"></span>
          <button class="button" type="button" disabled title="Planned: interaction editor milestone">
            Interactions
          </button>
          <button class="button" type="button" disabled title="Planned: the Local Runner compiles the HOOMD-blue script">
            Preview Code
          </button>
        </div>

        <div class="toolbar__group toolbar__group--end">
          <div id="connection-status" class="connection"></div>
        </div>
      </header>

      <div class="subbar">
        <div id="toolbar-tools" class="toolbar__group"></div>
        <div id="toolbar-view" class="toolbar__group toolbar__group--end"></div>
      </div>

      <main class="workspace">
        <aside class="panel panel--left" aria-label="Scene tree">
          <h2 class="panel__title">Scene Tree</h2>
          <div id="scene-tree" class="panel__body tree"></div>
        </aside>

        <section class="viewport" aria-label="Simulation view">
          <canvas id="viewport-canvas" tabindex="0"></canvas>
          <div class="viewport__hud">
            <span id="cursor-readout" class="viewport__readout"></span>
          </div>
          <p class="viewport__hint">
            Click to select · Drag to move · Alt-drag or middle-drag to pan · Scroll to zoom
          </p>
        </section>

        <aside class="panel panel--right" aria-label="Inspector">
          <h2 class="panel__title">Inspector</h2>
          <div id="inspector" class="panel__body"></div>
        </aside>
      </main>

      <footer class="dock">
        <div class="dock__header">
          <div id="bottom-tabs" class="dock__tabs" role="tablist"></div>
          <span id="bottom-badge" class="status-pill"></span>
        </div>
        <div id="bottom-content" class="dock__content"></div>
      </footer>
    </div>

    <dialog id="json-dialog" class="dialog">
      <div class="dialog__header">
        <h3 id="json-dialog-title" class="dialog__title"></h3>
        <button id="json-dialog-close" class="icon-button" type="button" aria-label="Close">×</button>
      </div>
      <pre id="json-dialog-body" class="dialog__body"></pre>
    </dialog>

    <input id="file-input" class="visually-hidden" type="file" accept="application/json,.json" />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
